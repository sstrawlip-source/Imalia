# This is a basic workflow to help you get started with Actions

name: hayun miya

# Controls when the workflow will run
on:the girl who finally speak
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:love
    branches: [ hayun miya]
  pull_request:
    branches: [ "kuyme ouki" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:love 

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:students
  # This workflow contains a single job called "build"
  build:a love story
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.Hayun Miya — a beautiful, quiet, slightly awkward introvert who rarely talks to anyone. She prefers sitting alone, reading, and observing people.
Kyume Ouki — confident, handsome, popular, and surrounded by admirers. But beneath his cheerful personality, he’s actually lonely and wants someone who sees him as a normal person.
Story idea
At first, Kyume barely notices Hayun. She’s simply the quiet girl in the corner.
Then one day, he sees her doing something unexpectedly kind, and it changes the way he looks at her.
He starts finding excuses to sit near her, talk to her, and make her smile. Hayun, who has never really allowed anyone close to her, slowly begins to care about him.But there's a problem:
Kyume falls for her slowly.
Hayun falls for him completely
